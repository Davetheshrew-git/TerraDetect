<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#44403c" stroke-width="4"/>
  
  <!-- Inner Radar / Ground Depth Grid Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#292524" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#44403c" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="30" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Crosshairs -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="#44403c" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6"/>
  <line x1="50" y1="256" x2="462" y2="256" stroke="#44403c" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6"/>
  
  <!-- Metal Detector Search Coil Icon Graphic -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)" filter="url(#glow)">
    <!-- Outer Coil Ring -->
    <ellipse cx="256" cy="265" rx="120" ry="100" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <!-- Inner Spoke Hub -->
    <ellipse cx="256" cy="265" rx="45" ry="38" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="10"/>
    
    <!-- Shaft connection bracket -->
    <path d="M 256 165 L 256 90 L 276 90 L 276 165 Z" fill="url(#goldGrad)" />
    <!-- Pulse Target Signal Dot -->
    <circle cx="256" cy="265" r="14" fill="#fbbf24"/>
    <circle cx="256" cy="265" r="24" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.75"/>
  </g>
  
  <!-- Crown / Scheduled Monument Crest Accent at top -->
  <path d="M 236 75 L 246 88 L 256 70 L 266 88 L 276 75 L 276 100 L 236 100 Z" fill="#f59e0b" opacity="0.9"/>
</svg>
